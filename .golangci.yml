# Refer to golangci-lint's example config file for more options and information:
# https://github.com/golangci/golangci-lint/blob/main/.golangci.reference.yml
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - revive
    - govet
    - staticcheck
    - gosec
  settings:
    revive:
      severity: warning

formatters:
  enable:
    - gofmt
    - goimports
